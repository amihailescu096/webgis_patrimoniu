# Creating this service incurs hosting charges. Configure secrets in Render.
services:
  - type: web
    name: harta-geojson
    runtime: node
    region: frankfurt
    plan: 1c-2g
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/session
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/harta
      - key: PUBLIC_ORIGIN
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
    disk:
      name: harta-data
      mountPath: /var/data
      sizeGB: 5
